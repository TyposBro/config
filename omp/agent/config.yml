setupVersion: 2
symbolPreset: nerd
theme: 
  dark: dark-tokyo-night
  light: light
modelRoles: 
  default: openai-codex/gpt-5.6-sol
  plan: openai-codex/gpt-5.6-sol:high
  slow: openai-codex/gpt-5.6-sol:high
  smol: openai-codex/gpt-5.6-luna:auto
  tiny: openai-codex/gpt-5.6-luna:low
  commit: openai-codex/gpt-5.6-luna:high
  task: openai-codex/gpt-5.6-terra:xhigh
  designer: openai-codex/gpt-5.6-terra:xhigh
  vision: openai-codex/gpt-5.6-terra:xhigh
  review: openai-codex/gpt-5.6-terra:max
  advisor: openai-codex/gpt-5.6-terra:max
modelTags: 
  plan: 
    name: CTO plan
    color: cyan
  task: 
    name: Terra implementation
    color: green
  review: 
    name: Terra review
    color: violet
cycleOrder: 
  - smol
  - default
  - slow
defaultThinkingLevel: auto
hideThinkingBlock: true
proseOnlyThinking: true
advisor: 
  enabled: false
prewalk: 
  enabled: false
task: 
  eager: default
  maxConcurrency: 8
  maxRecursionDepth: 1
  enableEffort: false
  enableLsp: true
  isolation: 
    mode: auto
  showResolvedModelBadge: true
  prewalk: false
  disabledAgents: 
    - planner
  agentModelOverrides: 
    task: "@task"
    designer: "@designer"
    reviewer: "@review"
    security-reviewer: "@review"
    scout: "@smol"
    librarian: "@smol"
    sonic: "@smol"
  agentAdvisor: 
    task: "off"
display: 
  showTokenUsage: true
  hideToolActivity: true
  smoothStreaming: true
browser: 
  headless: true
dev: 
  autoqaConsent: granted
composer: 
  shape: box
tui: 
  tight: true
  textSizing: true
  renderMermaid: true
statusLine: 
  preset: minimal
